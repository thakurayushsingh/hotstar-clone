---
- name: Deploy Hotstar Container using Ansible
  hosts: managed_nodes
  become: true
  vars:
    image_tag: "latest"
    container_name: "hotstar-app"
    host_port: 3000
    container_port: 3000
  tasks:
    - name: Pull the latest Hotstar Docker image
      command: "docker pull thakurayushsingh/hotstar:{{ image_tag }}"

    - name: Stop and remove existing container if running
      command: "docker rm -f {{ container_name }}"
      ignore_errors: yes

    - name: Run Hotstar application container
      command: >
        docker run -d
        --name {{ container_name }}
        --restart unless-stopped
        -p {{ host_port }}:{{ container_port }}
        thakurayushsingh/hotstar:{{ image_tag }}

    - name: Verify container is healthy and responding
      uri:
        url: "http://localhost:{{ host_port }}"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5
      ignore_errors: yes
