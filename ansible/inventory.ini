# Ansible Inventory for Hotstar DevSecOps Deployment
# Replace <NODE_IP> with the private or public IP of your managed EC2 instances

[control]
localhost ansible_connection=local

[managed_nodes]
# node1 ansible_host=13.232.xxx.xxx ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[k8s_nodes]
# k8s-worker-1 ansible_host=13.232.xxx.xxx ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
docker_image=thakurayushsingh/hotstar:latest
app_port=3000
